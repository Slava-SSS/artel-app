function init() {
  const sidebarMenu = document.getElementById('sidebar-menu');
  const aboutMain = document.getElementById('about-main');

  // Генерируем меню
  sidebarMenu.innerHTML = sections.map(s =>
    `<a class="sidebar-link" onclick="showSection('${s.id}')" data-section="${s.id}">${s.title}</a>`
  ).join('');

  // Генерируем контент
  aboutMain.innerHTML = sections.map(s =>
    `<div id="${s.id}" class="section">${s.content}</div>`
  ).join('');

  // Показываем первый раздел
  showSection('intro');
}

function showSection(id) {
  // Скрываем все
  document.querySelectorAll('.section').forEach(el => {
    el.classList.remove('active');
  });

  document.querySelectorAll('.sidebar-link').forEach(el => {
    el.classList.remove('active');
  });

  // Показываем выбранный
  const section = document.getElementById(id);
  const link = document.querySelector(`[data-section="${id}"]`);

  if (section) {
    section.classList.add('active');
    document.getElementById('about-main').scrollTop = 0;
  }

  if (link) {
    link.classList.add('active');
  }
}

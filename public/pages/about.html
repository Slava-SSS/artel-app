<!-- СТРАНИЦА "О ПРОЕКТЕ" - ПОЛНЫЙ ИНТЕРАКТИВНЫЙ РЕГЛАМЕНТ -->
<style>
* {
  box-sizing: border-box;
}

.about-page {
  display: grid;
  grid-template-columns: 280px 1fr;
  gap: 30px;
  padding: 30px;
  height: 100%;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}

/* БОКОВОЕ МЕНЮ */
.about-sidebar {
  position: sticky;
  top: 30px;
  height: fit-content;
  max-height: calc(100vh - 60px);
  overflow-y: auto;
}

.sidebar-header {
  font-size: 13px;
  font-weight: 700;
  color: var(--accent);
  text-transform: uppercase;
  letter-spacing: 1.2px;
  margin-bottom: 20px;
  padding-bottom: 12px;
  border-bottom: 2px solid var(--accent);
}

.sidebar-menu {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.sidebar-menu a {
  padding: 10px 14px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text-primary);
  text-decoration: none;
  cursor: pointer;
  transition: all 0.2s;
  font-size: 13px;
  border-left: 3px solid transparent;
  font-weight: 500;
}

.sidebar-menu a:hover {
  background: var(--bg-secondary);
  border-left-color: var(--accent);
  transform: translateX(4px);
}

.sidebar-menu a.active {
  background: var(--accent);
  color: white;
  border-left-color: white;
}

/* ОСНОВНОЙ КОНТЕНТ */
.about-content {
  display: flex;
  flex-direction: column;
  gap: 40px;
  overflow-y: auto;
  max-height: calc(100vh - 60px);
  padding-right: 15px;
}

.about-content::-webkit-scrollbar {
  width: 8px;
}

.about-content::-webkit-scrollbar-track {
  background: transparent;
}

.about-content::-webkit-scrollbar-thumb {
  background: var(--border);
  border-radius: 4px;
}

.about-content::-webkit-scrollbar-thumb:hover {
  background: var(--text-secondary);
}

/* ЗАГОЛОВОК */
.about-header {
  background: linear-gradient(135deg, var(--bg-card) 0%, var(--bg-secondary) 100%);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 30px;
}

.about-header h1 {
  font-size: 32px;
  margin: 0 0 8px 0;
  color: var(--text-primary);
}

.about-header .subtitle {
  font-size: 14px;
  color: var(--text-secondary);
  margin-bottom: 20px;
}

.about-version {
  display: flex;
  gap: 15px;
  flex-wrap: wrap;
  margin-top: 20px;
  padding-top: 20px;
  border-top: 1px solid var(--border);
}

.version-badge {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 7px 12px;
  background: var(--bg-secondary);
  border-radius: 6px;
  font-size: 12px;
  font-weight: 600;
}

/* СЕКЦИИ */
.section-content {
  display: none;
  animation: fadeIn 0.3s ease-in-out;
}

.section-content.active {
  display: block;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

.section-title {
  font-size: 24px;
  font-weight: 700;
  margin-bottom: 20px;
  padding-bottom: 12px;
  border-bottom: 3px solid var(--accent);
  display: flex;
  align-items: center;
  gap: 10px;
}

/* ТЕКСТ */
.markdown-content {
  line-height: 1.8;
  font-size: 14px;
}

.markdown-content h3 {
  font-size: 16px;
  font-weight: 700;
  margin: 25px 0 12px 0;
  color: var(--text-primary);
}

.markdown-content h4 {
  font-size: 14px;
  font-weight: 700;
  margin: 15px 0 10px 0;
  color: var(--accent);
}

.markdown-content p {
  margin: 10px 0;
  color: var(--text-primary);
}

.markdown-content strong {
  color: var(--accent);
  font-weight: 700;
}

.markdown-content code {
  background: var(--bg-secondary);
  padding: 2px 6px;
  border-radius: 3px;
  font-family: 'Courier New', monospace;
  font-size: 12px;
  color: #FF6B6B;
}

/* СПИСКИ */
.checkbox-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin: 15px 0;
}

.checkbox-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  background: var(--bg-card);
  border-radius: 6px;
  border-left: 3px solid transparent;
  font-size: 13px;
  cursor: pointer;
  transition: all 0.2s;
}

.checkbox-item:hover {
  background: var(--bg-secondary);
}

.checkbox-item input[type="checkbox"] {
  cursor: pointer;
  accent-color: var(--accent);
}

.checkbox-item.ok {
  border-left-color: #4CAF50;
}

.checkbox-item.no {
  border-left-color: #F44336;
}

/* ТАБЛИЦЫ */
.markdown-table {
  width: 100%;
  border-collapse: collapse;
  margin: 15px 0;
  border: 1px solid var(--border);
  border-radius: 6px;
  overflow: hidden;
  font-size: 13px;
}

.markdown-table th {
  background: var(--accent);
  color: white;
  padding: 12px;
  text-align: left;
  font-weight: 700;
}

.markdown-table td {
  padding: 12px;
  border-bottom: 1px solid var(--border);
}

.markdown-table tr:hover {
  background: var(--bg-card);
}

.markdown-table tr:last-child td {
  border-bottom: none;
}

/* ВЫДЕЛЕНИЯ */
.highlight {
  padding: 12px 16px;
  border-radius: 6px;
  margin: 15px 0;
  border-left: 3px solid;
  font-size: 13px;
  line-height: 1.6;
}

.highlight.success {
  background: rgba(76, 175, 80, 0.1);
  border-left-color: #4CAF50;
}

.highlight.error {
  background: rgba(244, 67, 54, 0.1);
  border-left-color: #F44336;
}

.highlight.warning {
  background: rgba(255, 193, 7, 0.1);
  border-left-color: #FFC107;
}

.highlight.info {
  background: rgba(var(--accent-rgb), 0.1);
  border-left-color: var(--accent);
}

/* КОД */
.code-block {
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 15px;
  margin: 15px 0;
  overflow-x: auto;
  font-family: 'Courier New', monospace;
  font-size: 12px;
  line-height: 1.6;
  color: #E8F5E9;
}

/* КАРТОЧКИ */
.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 16px;
  margin: 10px 0;
  transition: all 0.2s;
}

.card:hover {
  border-color: var(--accent);
}

.card-title {
  font-weight: 700;
  font-size: 14px;
  margin-bottom: 8px;
  color: var(--text-primary);
}

.card-text {
  font-size: 13px;
  color: var(--text-secondary);
  line-height: 1.6;
}

/* BUTTONS */
.about-actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 20px;
}

.btn-about {
  padding: 10px 16px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  gap: 6px;
}

.btn-about.primary {
  background: var(--accent);
  color: white;
}

.btn-about.primary:hover {
  opacity: 0.9;
}

.btn-about.secondary {
  background: var(--bg-card);
  border: 1px solid var(--border);
  color: var(--text-primary);
}

.btn-about.secondary:hover {
  background: var(--bg-secondary);
}

/* LOADING */
.loading {
  text-align: center;
  padding: 40px;
  color: var(--text-secondary);
}

/* RESPONSIVE */
@media (max-width: 1024px) {
  .about-page {
    grid-template-columns: 1fr;
    gap: 20px;
  }

  .about-sidebar {
    position: relative;
    top: auto;
    max-height: none;
  }

  .sidebar-menu {
    flex-direction: row;
    flex-wrap: wrap;
  }

  .about-content {
    max-height: none;
  }
}
</style>

<div class="about-page">
  <!-- БОКОВОЕ МЕНЮ -->
  <aside class="about-sidebar">
    <div class="sidebar-header">📖 Разделы</div>
    <nav class="sidebar-menu" id="sidebar-menu">
      <!-- Генерируется JavaScript -->
    </nav>
  </aside>

  <!-- ОСНОВНОЙ КОНТЕНТ -->
  <div class="about-content" id="about-content">
    <div class="loading">⏳ Загрузка СТРУКТУРЫ-АРТЕЛЬ...</div>
  </div>
</div>

<script>
let structureData = null;

// Загрузить СТРУКТУРУ-АРТЕЛЬ.md
async function loadStructure() {
  try {
    const response = await fetch('../docs/СТРУКТУРА-АРТЕЛЬ.md');
    if (!response.ok) throw new Error('Failed to load');

    const markdown = await response.text();
    structureData = markdown;

    renderPage();
  } catch (error) {
    console.error('Error loading structure:', error);
    document.getElementById('about-content').innerHTML =
      '<div class="loading">❌ Ошибка при загрузке документации</div>';
  }
}

// Парсить Markdown и выделить разделы
function parseMarkdown(markdown) {
  const sections = [];
  let currentSection = null;
  let currentContent = [];

  const lines = markdown.split('\n');

  for (const line of lines) {
    if (line.match(/^## \d\. /)) {
      if (currentSection) {
        sections.push({
          id: currentSection.id,
          title: currentSection.title,
          content: currentContent.join('\n')
        });
      }
      const match = line.match(/^## \d\. (.+)/);
      currentSection = {
        id: match[1].toLowerCase().replace(/\s+/g, '-').substring(0, 20),
        title: match[1]
      };
      currentContent = [];
    } else if (currentSection) {
      currentContent.push(line);
    }
  }

  if (currentSection) {
    sections.push({
      id: currentSection.id,
      title: currentSection.title,
      content: currentContent.join('\n')
    });
  }

  return sections;
}

// Конвертировать Markdown в HTML
function markdownToHtml(md) {
  let html = md
    // Заголовки
    .replace(/^### (.*?)$/gm, '<h3>$1</h3>')
    .replace(/^#### (.*?)$/gm, '<h4>$1</h4>')

    // Выделения
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.*?)\*/g, '<em>$1</em>')

    // Ссылки
    .replace(/\[(.*?)\]\((.*?)\)/g, '<a href="$2" target="_blank" style="color: var(--accent);">$1</a>')

    // Код в строке
    .replace(/`(.*?)`/g, '<code>$1</code>')

    // Блоки кода
    .replace(/```(.*?)```/s, '<div class="code-block">$1</div>')

    // Таблицы (простой парсинг)
    .replace(/\| (.*?) \|/g, (match, content) => {
      return '<tr><td>' + content.split('|').map(c => '<td>' + c.trim() + '</td>').join('') + '</tr>';
    })

    // Параграфы
    .replace(/\n\n/g, '</p><p>')
    .replace(/^/gm, (match, offset, str) => {
      if (offset === 0 || str[offset - 1] === '\n') return '<p>';
      return match;
    });

  return '<div class="markdown-content">' + html + '</div>';
}

// Отобразить страницу
function renderPage() {
  const sections = parseMarkdown(structureData);

  const container = document.getElementById('about-content');
  const sidebar = document.getElementById('sidebar-menu');

  // Заголовок
  let html = `
    <div class="about-header">
      <h1>🏗️ АРТЕЛЬ</h1>
      <p class="subtitle">Полный регламент разработки</p>
      <div class="about-version">
        <div class="version-badge">📌 v0.7.1</div>
        <div class="version-badge">✅ Активный документ</div>
      </div>
      <div class="about-actions">
        <button class="btn-about primary" onclick="window.location.href='../index.html'">← К Dashboard</button>
      </div>
    </div>
  `;

  // Меню
  sidebar.innerHTML = sections.map(s =>
    `<a class="menu-item" onclick="showSection('${s.id}')" data-section="${s.id}">${s.title}</a>`
  ).join('');

  // Разделы
  sections.forEach(section => {
    html += `
      <div id="${section.id}" class="section-content">
        <h2 class="section-title">${section.title}</h2>
        ${markdownToHtml(section.content)}
      </div>
    `;
  });

  container.innerHTML = html;

  // Первый раздел активен
  if (sections.length > 0) {
    showSection(sections[0].id);
  }
}

// Показать раздел
function showSection(sectionId) {
  document.querySelectorAll('.section-content').forEach(el => {
    el.classList.remove('active');
  });

  document.querySelectorAll('.menu-item').forEach(el => {
    el.classList.remove('active');
  });

  const section = document.getElementById(sectionId);
  const menuItem = document.querySelector(`[data-section="${sectionId}"]`);

  if (section) {
    section.classList.add('active');
    document.querySelector('.about-content').scrollTop = 0;
  }

  if (menuItem) {
    menuItem.classList.add('active');
  }
}

// Загрузить при открытии
window.addEventListener('load', loadStructure);
</script>
